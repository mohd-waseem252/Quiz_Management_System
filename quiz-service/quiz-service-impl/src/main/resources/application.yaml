server:
  port: 8080
  servlet:
    context-path: /quiz-ws
  tomcat:
    accesslog:
      enabled: true
      directory: logs
      buffered: false
      prefix: access_log
      suffix: .log
      pattern: common

spring:
  datasource:
    url: jdbc:h2:mem:quizdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  application:
    name: /quiz-service
  main:
    allow-bean-definition-overriding: true


logging:
  level:
    root: INFO
    com.tachnique: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.glassfish.jersey: DEBUG